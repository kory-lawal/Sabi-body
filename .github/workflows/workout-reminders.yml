# Triggers SabiBody's reminder job every 15 minutes.
# The backend decides who is due (timezone, chosen time, no workout today) and
# records each delivery so nobody receives the same reminder twice.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SABIBODY_API_URL  e.g. https://sabi-body-1.onrender.com
#   CRON_SECRET       the same value as CRON_SECRET on Render
# GitHub runs scheduled workflows on a best-effort basis (often a few minutes
# late); the backend accepts reminders up to REMINDER_SEND_WINDOW_MINUTES late.
name: Workout reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run reminder job
        env:
          API_URL: ${{ secrets.SABIBODY_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SABIBODY_API_URL or CRON_SECRET is not configured; skipping."
            exit 0
          fi
          # Render free instances sleep; allow time for a cold start.
          curl --fail-with-body --silent --show-error --max-time 120 --retry 2 --retry-delay 20 \
            -X POST "$API_URL/api/internal/reminders/run" \
            -H "Authorization: Bearer $CRON_SECRET"
